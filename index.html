<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111a2c">
  <title>魔法来信</title>
  <style>
    html, body { margin: 0; min-height: 100%; overflow: hidden; background: #111a2c; }
    body { font-family: system-ui, -apple-system, sans-serif; }
    button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  </style>
</head>
<body>
<div id="magic-owl-letter">
  <style>
    #magic-owl-letter {
      --mol-night: #070b13;
      --mol-night-soft: #17243b;
      --mol-ink: #eadbc4;
      --mol-paper: #f4e4c5;
      --mol-paper-shadow: #c7a978;
      --mol-wax: #8f2c39;
      --mol-gold: #e3c47a;
      padding: 8px 0 48px;
      color: var(--mol-ink);
    }
    #magic-owl-letter * { box-sizing: border-box; }
    #magic-owl-letter .mol-stage {
      position: relative;
      width: 100%;
      min-height: 440px;
      overflow: hidden;
      border-radius: 18px;
      background:
        radial-gradient(circle at 76% 16%, rgba(248,232,177,.22), transparent 17%),
        radial-gradient(circle at 50% 120%, rgba(201,150,75,.16), transparent 45%),
        linear-gradient(155deg, var(--mol-night-soft), var(--mol-night) 58%);
      box-shadow: 0 24px 50px rgba(0,0,0,.42);
      isolation: isolate;
    }
    #magic-owl-letter .mol-stars,
    #magic-owl-letter .mol-stars::before,
    #magic-owl-letter .mol-stars::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 9% 18%, rgba(255,246,213,.82) 0 1px, transparent 1.7px),
        radial-gradient(circle at 22% 31%, rgba(255,246,213,.54) 0 1px, transparent 1.7px),
        radial-gradient(circle at 37% 12%, rgba(255,246,213,.72) 0 1px, transparent 1.7px),
        radial-gradient(circle at 55% 27%, rgba(255,246,213,.42) 0 1px, transparent 1.7px),
        radial-gradient(circle at 69% 8%, rgba(255,246,213,.69) 0 1px, transparent 1.7px),
        radial-gradient(circle at 88% 35%, rgba(255,246,213,.52) 0 1px, transparent 1.7px);
    }
    #magic-owl-letter .mol-stars::before { transform: translate(7%, 39%) scale(.88); opacity: .7; }
    #magic-owl-letter .mol-stars::after { transform: translate(-3%, 68%) scale(.7); opacity: .45; }
    #magic-owl-letter .mol-moon {
      position: absolute;
      right: 9%;
      top: 34px;
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: #f4e5b8;
      box-shadow: 0 0 42px rgba(244,229,184,.25);
    }
    #magic-owl-letter .mol-moon::after {
      content: "";
      position: absolute;
      inset: 8px 0 0 15px;
      border-radius: 50%;
      background: var(--mol-night-soft);
    }
    #magic-owl-letter .mol-hills {
      position: absolute;
      left: -5%;
      right: -5%;
      bottom: 0;
      height: 115px;
      background: #0b0f16;
      clip-path: polygon(0 53%, 10% 40%, 20% 48%, 30% 29%, 37% 42%, 48% 20%, 60% 39%, 72% 15%, 81% 34%, 91% 26%, 100% 46%, 100% 100%, 0 100%);
    }
    #magic-owl-letter .mol-castle {
      position: absolute;
      right: 18%;
      bottom: 68px;
      width: 110px;
      height: 72px;
      background: #0b0f16;
      clip-path: polygon(0 100%, 0 48%, 12% 48%, 12% 28%, 19% 28%, 22% 0, 27% 28%, 34% 28%, 34% 58%, 47% 58%, 47% 36%, 54% 36%, 58% 10%, 62% 36%, 70% 36%, 70% 55%, 82% 55%, 82% 38%, 88% 38%, 91% 8%, 94% 38%, 100% 38%, 100% 100%);
    }
    #magic-owl-letter .mol-owl {
      position: absolute;
      left: -170px;
      top: 74px;
      width: 158px;
      height: 104px;
      z-index: 4;
      transform: scale(.58) rotate(-5deg);
      filter: drop-shadow(0 14px 12px rgba(0,0,0,.28));
    }
    #magic-owl-letter .mol-owl-body {
      position: absolute;
      left: 48px;
      top: 24px;
      width: 66px;
      height: 79px;
      border-radius: 52% 52% 48% 48%;
      background:
        radial-gradient(ellipse at 32% 30%, #786d62 0 2px, transparent 3px),
        radial-gradient(ellipse at 64% 48%, #8c8074 0 2px, transparent 3px),
        linear-gradient(110deg, #f6f1e7, #c9c0b3);
    }
    #magic-owl-letter .mol-owl-head {
      position: absolute;
      left: 45px;
      top: 0;
      width: 73px;
      height: 62px;
      border-radius: 50% 50% 43% 43%;
      background:
        radial-gradient(circle at 30% 45%, #131516 0 4px, #c6a554 5px 10px, #ebe5d9 11px 19px, transparent 20px),
        radial-gradient(circle at 70% 45%, #131516 0 4px, #c6a554 5px 10px, #ebe5d9 11px 19px, transparent 20px),
        linear-gradient(#faf7ef, #d6cec2);
    }
    #magic-owl-letter .mol-owl-head::after {
      content: "";
      position: absolute;
      left: 31px;
      top: 35px;
      border-top: 13px solid #cf9f45;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
    }
    #magic-owl-letter .mol-beak-grip {
      position: absolute;
      left: 79px;
      top: 43px;
      z-index: 5;
      width: 2px;
      height: 18px;
      background: #b18a4c;
      transform: rotate(-4deg);
    }
    #magic-owl-letter .mol-carried-letter {
      position: absolute;
      left: 58px;
      top: 58px;
      z-index: 6;
      width: 48px;
      height: 31px;
      border: 1px solid rgba(88,62,37,.36);
      border-radius: 2px;
      background: #eddbb9;
      box-shadow: 0 7px 10px rgba(0,0,0,.22);
      transform: rotate(7deg);
    }
    #magic-owl-letter .mol-carried-letter::before {
      content: "";
      position: absolute;
      inset: 0;
      background: #d8bb8c;
      clip-path: polygon(0 0, 50% 62%, 100% 0);
    }
    #magic-owl-letter .mol-carried-letter::after {
      content: "";
      position: absolute;
      left: 19px;
      top: 15px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--mol-wax);
    }
    #magic-owl-letter .mol-wing {
      position: absolute;
      top: 25px;
      width: 79px;
      height: 36px;
      background: linear-gradient(160deg, #f3eee5, #aaa194);
      box-shadow: inset 0 -7px 0 rgba(85,76,67,.14);
    }
    #magic-owl-letter .mol-wing-left {
      left: 0;
      border-radius: 100% 5% 65% 20%;
      transform-origin: 100% 55%;
      transform: rotate(14deg);
    }
    #magic-owl-letter .mol-wing-right {
      right: 0;
      border-radius: 5% 100% 20% 65%;
      transform-origin: 0 55%;
      transform: rotate(-14deg);
    }
    #magic-owl-letter .mol-letter {
      position: absolute;
      left: calc(50% - 82px);
      top: -140px;
      width: 164px;
      height: 106px;
      z-index: 6;
      perspective: 700px;
      filter: drop-shadow(0 18px 18px rgba(0,0,0,.28));
    }
    #magic-owl-letter .mol-envelope {
      position: absolute;
      inset: 0;
      background: var(--mol-paper);
      border: 1px solid rgba(93,67,42,.35);
      border-radius: 3px;
      overflow: visible;
    }
    #magic-owl-letter .mol-envelope::before,
    #magic-owl-letter .mol-envelope::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    #magic-owl-letter .mol-envelope::before {
      background: var(--mol-paper-shadow);
      clip-path: polygon(0 100%, 50% 48%, 100% 100%);
    }
    #magic-owl-letter .mol-envelope::after {
      background: color-mix(in srgb, var(--mol-paper) 88%, #8b6c45);
      clip-path: polygon(0 0, 50% 58%, 100% 0);
    }
    #magic-owl-letter .mol-flap {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 62px;
      z-index: 4;
      transform-origin: 50% 0;
      transform-style: preserve-3d;
      background: var(--mol-paper-shadow);
      clip-path: polygon(0 0, 50% 100%, 100% 0);
      backface-visibility: visible;
    }
    #magic-owl-letter .mol-seal {
      position: absolute;
      left: calc(50% - 27px);
      top: 33px;
      z-index: 8;
      width: 54px;
      height: 54px;
      border: 0;
      border-radius: 50%;
      color: #f1c777;
      background: radial-gradient(circle at 40% 35%, #b94c57, var(--mol-wax) 68%);
      box-shadow: 0 4px 10px rgba(0,0,0,.22), inset 0 0 0 4px rgba(255,227,182,.08);
      font: 500 20px/1 Georgia, serif;
      opacity: 0;
      pointer-events: none;
      transform: scale(.82);
    }
    #magic-owl-letter .mol-seal::before { content: "✦"; }
    #magic-owl-letter .mol-name {
      position: absolute;
      left: 16px;
      right: 16px;
      top: 13px;
      z-index: 7;
      color: #594430;
      text-align: center;
      font: 500 13px/1.2 ui-serif, Georgia, serif;
      letter-spacing: .08em;
      text-shadow: 0 1px rgba(255,255,255,.35);
    }
    #magic-owl-letter .mol-sheet {
      position: absolute;
      left: 7%;
      right: 7%;
      top: 62px;
      height: 312px;
      z-index: 3;
      padding: 45px 11% 35px;
      opacity: 0;
      transform: translateY(95px) scale(.62);
      transform-origin: 50% 0;
      overflow: hidden;
      color: #554331;
      background:
        linear-gradient(90deg, rgba(124,82,45,.07), transparent 13%, transparent 88%, rgba(124,82,45,.07)),
        linear-gradient(115deg, #f4e5c8, #e2caa2);
      border: 1px solid rgba(91,65,39,.28);
      border-radius: 3px;
      box-shadow: 0 18px 40px rgba(0,0,0,.30);
      pointer-events: none;
    }
    #magic-owl-letter .mol-sheet h3 {
      margin: 0 0 16px;
      font: 500 19px/1.2 ui-serif, Georgia, serif;
    }
    #magic-owl-letter .mol-sheet p {
      margin: 0;
      max-width: 430px;
      font: 400 14px/1.8 ui-serif, Georgia, serif;
    }
    #magic-owl-letter .mol-lines {
      display: block;
      height: 1px;
      margin-top: 13px;
      background: rgba(85,67,49,.28);
      box-shadow: 0 12px rgba(85,67,49,.23), 0 24px rgba(85,67,49,.18), 0 36px rgba(85,67,49,.14);
    }
    #magic-owl-letter .mol-photo {
      position: absolute;
      left: calc(50% - 74px);
      top: 80px;
      z-index: 7;
      width: 148px;
      height: 122px;
      padding: 8px 8px 20px;
      opacity: 0;
      transform: translateY(85px) rotate(-3deg) scale(.55);
      transform-origin: 50% 50%;
      background: #efe8dc;
      box-shadow: 0 15px 27px rgba(0,0,0,.32);
      pointer-events: none;
      border: 0;
      color: inherit;
      text-align: inherit;
    }
    #magic-owl-letter .mol-hand {
      position: absolute;
      left: 50%;
      bottom: -190px;
      z-index: 5;
      width: 185px;
      height: 180px;
      transform: translateX(-50%) rotate(-5deg);
      filter: drop-shadow(0 18px 18px rgba(0,0,0,.28));
      pointer-events: none;
    }
    #magic-owl-letter .mol-palm {
      position: absolute;
      left: 43px;
      top: 26px;
      width: 108px;
      height: 118px;
      border-radius: 48% 48% 42% 42%;
      background: linear-gradient(120deg, #d8a17d, #a96950);
      box-shadow: inset -14px 8px 0 rgba(98,54,40,.11);
    }
    #magic-owl-letter .mol-palm::before {
      content: "";
      position: absolute;
      left: -31px;
      top: 44px;
      width: 61px;
      height: 32px;
      border-radius: 70% 30% 55% 45%;
      background: #c88d6d;
      transform: rotate(22deg);
      box-shadow: inset 0 -5px 0 rgba(98,54,40,.08);
    }
    #magic-owl-letter .mol-palm::after {
      content: "";
      position: absolute;
      left: 28px;
      bottom: -81px;
      width: 62px;
      height: 96px;
      border-radius: 0 0 24px 24px;
      background: linear-gradient(90deg, #bc7f62, #9e604b);
    }
    #magic-owl-letter .mol-fingers {
      position: absolute;
      left: 52px;
      top: 0;
      width: 21px;
      height: 70px;
      border-radius: 18px 18px 8px 8px;
      background: #d8a17d;
      box-shadow: 25px -10px 0 #d39a76, 50px -4px 0 #cc906e, 75px 9px 0 #bd7f61;
    }
    #magic-owl-letter .mol-photo-image {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background: linear-gradient(145deg, #d8b486, #6c8191);
    }
    #magic-owl-letter .mol-photo-image svg { display: block; width: 100%; height: 100%; }
    #magic-owl-letter .mol-photo-viewer {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: none;
      place-items: center;
      padding: 24px;
      background: rgba(5,8,15,.82);
      backdrop-filter: blur(12px);
    }
    #magic-owl-letter .mol-photo-viewer.is-visible { display: grid; }
    #magic-owl-letter .mol-photo-dialog {
      width: min(88vw, 430px);
      display: grid;
      justify-items: center;
      gap: 16px;
      perspective: 1100px;
    }
    #magic-owl-letter .mol-photo-card {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      transform-style: preserve-3d;
      transition: transform .7s cubic-bezier(.2,.7,.2,1);
    }
    #magic-owl-letter .mol-photo-card.is-flipped { transform: rotateY(180deg); }
    #magic-owl-letter .mol-photo-face {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px 18px 42px;
      backface-visibility: hidden;
      background: #f1eadf;
      box-shadow: 0 24px 70px rgba(0,0,0,.45);
    }
    #magic-owl-letter .mol-photo-front .mol-photo-image { width: 100%; height: 100%; }
    #magic-owl-letter .mol-photo-back {
      transform: rotateY(180deg);
      padding: 42px;
      color: #5b4633;
      background:
        repeating-linear-gradient(0deg, rgba(101,73,46,.035) 0 1px, transparent 1px 5px),
        #e9dcc5;
      font: 500 22px/1.7 ui-serif, Georgia, serif;
      text-align: center;
    }
    #magic-owl-letter .mol-photo-actions { display: flex; gap: 10px; }
    #magic-owl-letter .mol-photo-actions button {
      min-height: 44px;
      padding: 0 17px;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 999px;
      color: #f5ead8;
      background: rgba(22,27,39,.76);
      font: 500 14px/1 system-ui, sans-serif;
    }
    #magic-owl-letter .mol-intro {
      position: absolute;
      left: 50%;
      top: 52%;
      z-index: 15;
      width: min(86%, 430px);
      transform: translate(-50%, -50%);
      text-align: center;
      color: #f4ead7;
    }
    #magic-owl-letter .mol-route-intro {
      position: absolute;
      inset: 58px 0 18px;
      z-index: 13;
      display: grid;
      place-items: center;
      pointer-events: none;
      transition: opacity .7s ease, transform .7s ease;
    }
    #magic-owl-letter .mol-route-scene {
      width: 211px;
      height: 364px;
      aspect-ratio: 360 / 620;
      overflow: visible;
    }
    #magic-owl-letter .mol-landmark {
      filter: drop-shadow(0 12px 15px rgba(0,0,0,.28));
      opacity: .68;
      transition: opacity .5s ease, filter .5s ease;
    }
    #magic-owl-letter .mol-route-line {
      fill: none;
      stroke: #e6c77c;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 780;
      stroke-dashoffset: 780;
      filter: drop-shadow(0 0 7px rgba(230,199,124,.58));
    }
    #magic-owl-letter .mol-route-feather {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
    }
    #magic-owl-letter .mol-stage.is-route .mol-intro { animation: mol-fade-away .55s ease forwards; }
    #magic-owl-letter .mol-stage.is-route .mol-route-line { animation: mol-sign-route 3.35s .38s cubic-bezier(.42,0,.18,1) forwards; }
    #magic-owl-letter .mol-stage.is-route .mol-landmark-start { animation: mol-landmark-send 1s .15s ease both; }
    #magic-owl-letter .mol-stage.is-route .mol-landmark-end { animation: mol-landmark-receive 1s 3s ease both; }
    #magic-owl-letter .mol-stage.is-route .mol-route-feather { animation: mol-feather-arrive .9s 3.55s ease forwards; }
    #magic-owl-letter .mol-stage.is-route .mol-hand { opacity: 0; }
    #magic-owl-letter .mol-stage.is-playing .mol-route-intro,
    #magic-owl-letter .mol-stage.is-ready .mol-route-intro,
    #magic-owl-letter .mol-stage.is-open .mol-route-intro { opacity: 0; transform: translateY(-12px); }
    #magic-owl-letter .mol-stage.is-lite .mol-stars::before,
    #magic-owl-letter .mol-stage.is-lite .mol-stars::after { display: none; }
    #magic-owl-letter .mol-stage.is-lite .mol-owl,
    #magic-owl-letter .mol-stage.is-lite .mol-landmark,
    #magic-owl-letter .mol-stage.is-lite .mol-route-line { filter: none; }
    #magic-owl-letter .mol-stage.is-lite .mol-toolbar,
    #magic-owl-letter .mol-stage.is-lite .mol-photo-viewer { backdrop-filter: none; }
    #magic-owl-letter .mol-stage.is-lite.is-route .mol-route-line { animation-duration: 2s; animation-delay: .2s; }
    #magic-owl-letter .mol-stage.is-lite.is-route .mol-landmark-end { animation-delay: 1.55s; }
    #magic-owl-letter .mol-stage.is-lite.is-route .mol-route-feather { animation-delay: 1.85s; animation-duration: .55s; }
    #magic-owl-letter .mol-stage.is-lite.is-playing .mol-owl { animation-duration: 2.7s; }
    #magic-owl-letter .mol-stage.is-lite.is-playing .mol-letter,
    #magic-owl-letter .mol-stage.is-lite.is-playing .mol-hand { animation-duration: 2.75s; }
    #magic-owl-letter .mol-stage.is-lite.is-open .mol-photo { animation-duration: 2s; }
    #magic-owl-letter .mol-intro h2 {
      margin: 0 0 9px;
      font: 500 28px/1.2 ui-serif, Georgia, serif;
      letter-spacing: .03em;
    }
    #magic-owl-letter .mol-intro p {
      margin: 0 0 22px;
      color: rgba(244,234,215,.76);
      font: 400 13px/1.55 ui-sans-serif, system-ui, sans-serif;
    }
    #magic-owl-letter .mol-intro .mol-track {
      display: block;
      margin: -10px 0 19px;
      color: rgba(244,234,215,.58);
      font: 400 11px/1.4 ui-sans-serif, system-ui, sans-serif;
      letter-spacing: .04em;
    }
    #magic-owl-letter .mol-action,
    #magic-owl-letter .mol-icon-action {
      min-height: 44px;
      border: 1px solid rgba(244,234,215,.38);
      border-radius: 999px;
      color: #271d14;
      background: #e8cf9f;
      font: 500 14px/1 ui-sans-serif, system-ui, sans-serif;
      box-shadow: 0 9px 24px rgba(0,0,0,.24);
    }
    #magic-owl-letter .mol-action { padding: 0 20px; }
    #magic-owl-letter .mol-icon-action {
      width: 44px;
      padding: 0;
      color: #f1e4cf;
      background: rgba(16,20,30,.55);
    }
    #magic-owl-letter .mol-toolbar {
      position: absolute;
      left: 12px;
      right: 12px;
      top: 12px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
    }
    #magic-owl-letter .mol-toolbar button { pointer-events: auto; }
    #magic-owl-letter .mol-status {
      padding: 7px 11px;
      border-radius: 999px;
      color: rgba(244,234,215,.82);
      background: rgba(12,16,25,.46);
      backdrop-filter: blur(8px);
      font: 400 12px/1 ui-sans-serif, system-ui, sans-serif;
    }
    #magic-owl-letter .mol-replay {
      position: absolute;
      right: 18px;
      bottom: 16px;
      z-index: 14;
      opacity: 0;
      pointer-events: none;
    }
    #magic-owl-letter .mol-stage.is-playing .mol-intro { animation: mol-fade-away .65s ease forwards; }
    #magic-owl-letter .mol-stage.is-playing .mol-owl { animation: mol-owl-flight 4.1s cubic-bezier(.18,.7,.25,1) forwards; }
    #magic-owl-letter .mol-stage.is-playing .mol-carried-letter,
    #magic-owl-letter .mol-stage.is-playing .mol-beak-grip { animation: mol-release-letter 4.1s linear forwards; }
    #magic-owl-letter .mol-stage.is-playing .mol-wing-left { animation: mol-wing-left .36s ease-in-out infinite alternate; }
    #magic-owl-letter .mol-stage.is-playing .mol-wing-right { animation: mol-wing-right .36s ease-in-out infinite alternate; }
    #magic-owl-letter .mol-stage.is-playing .mol-letter { animation: mol-letter-flight 4.15s cubic-bezier(.22,.72,.24,1) forwards; }
    #magic-owl-letter .mol-stage.is-playing .mol-hand { animation: mol-reach-hand 4.15s cubic-bezier(.22,.7,.24,1) forwards; }
    #magic-owl-letter .mol-stage.is-ready .mol-owl { opacity: 0; }
    #magic-owl-letter .mol-stage.is-ready .mol-intro { display: none; }
    #magic-owl-letter .mol-stage.is-ready .mol-letter { top: 172px; }
    #magic-owl-letter .mol-stage.is-ready .mol-hand { bottom: -38px; }
    #magic-owl-letter .mol-stage.is-ready .mol-seal { opacity: 1; pointer-events: auto; transform: scale(1); animation: mol-seal-pulse 1.8s ease-in-out infinite; }
    #magic-owl-letter .mol-stage.is-open .mol-seal { opacity: 0; pointer-events: none; animation: none; }
    #magic-owl-letter .mol-stage.is-open .mol-flap { animation: mol-open-flap .7s ease forwards; }
    #magic-owl-letter .mol-stage.is-open .mol-letter { animation: mol-envelope-away .8s 2.7s ease forwards; }
    #magic-owl-letter .mol-stage.is-open .mol-hand { animation: mol-hand-away .75s 1.85s ease forwards; }
    #magic-owl-letter .mol-stage.is-open .mol-photo { animation: mol-photo-story 3.2s .55s cubic-bezier(.25,.75,.22,1) forwards; }
    #magic-owl-letter .mol-stage.is-open .mol-photo { pointer-events: auto; }

  <script>
    (() => {
      const root = document.getElementById('magic-owl-letter');
      const stage = root.querySelector('.mol-stage');
      const start = root.querySelector('.mol-start');
      const seal = root.querySelector('.mol-seal');
      const replay = root.querySelector('.mol-replay');
      const sound = root.querySelector('.mol-sound');
      const status = root.querySelector('.mol-status');
      const photo = root.querySelector('.mol-photo');
      const photoViewer = root.querySelector('.mol-photo-viewer');
      const photoCard = root.querySelector('.mol-photo-card');
      const photoFront = root.querySelector('.mol-photo-front');
      const flipPhoto = root.querySelector('.mol-flip-photo');
      const closePhoto = root.querySelector('.mol-close-photo');
      const liteMode = window.matchMedia('(max-width: 600px), (pointer: coarse)').matches;
      stage.classList.toggle('is-lite', liteMode);
      let soundOn = true;
      let readyTimer = 0;
      let routeTimer = 0;
      let watchdogTimer = 0;
      let audioContext = null;
      let musicTimer = 0;
      const musicNodes = new Set();

      const setStatus = (message) => { status.textContent = message; };

      const getAudioContext = () => {
        if (!audioContext) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioContext = new AudioContextClass();
        }
        return audioContext;
      };

      const remember = (node) => {
        musicNodes.add(node);
        node.addEventListener('ended', () => musicNodes.delete(node), { once: true });
        return node;
      };

      const tone = (frequency, startAt, duration, volume, type = 'sine', destination = null) => {
        const context = getAudioContext();
        if (!context || !soundOn) return;
        const oscillator = context.createOscillator();
        const gain = context.createGain();
        oscillator.type = type;
        oscillator.frequency.setValueAtTime(frequency, startAt);
        gain.gain.setValueAtTime(0.0001, startAt);
        gain.gain.exponentialRampToValueAtTime(volume, startAt + 0.025);
        gain.gain.exponentialRampToValueAtTime(0.0001, startAt + duration);
        oscillator.connect(gain).connect(destination || context.destination);
        remember(oscillator);
        oscillator.start(startAt);
        oscillator.stop(startAt + duration + 0.03);
      };

      const midi = (number) => 440 * Math.pow(2, (number - 69) / 12);

      const softPiano = (notes, startAt, duration, master) => {
        const context = getAudioContext();
        if (!context || !soundOn) return;
        notes.forEach((note, index) => {
          const oscillator = context.createOscillator();
          const filter = context.createBiquadFilter();
          const gain = context.createGain();
          oscillator.type = index % 2 ? 'triangle' : 'sine';
          oscillator.frequency.setValueAtTime(midi(note), startAt + index * .018);
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(1650, startAt);
          gain.gain.setValueAtTime(.0001, startAt + index * .018);
          gain.gain.exponentialRampToValueAtTime(.042, startAt + .035 + index * .018);
          gain.gain.exponentialRampToValueAtTime(.0001, startAt + duration);
          oscillator.connect(filter).connect(gain).connect(master);
          remember(oscillator);
          oscillator.start(startAt + index * .018);
          oscillator.stop(startAt + duration + .04);
        });
      };

      const uprightBass = (note, startAt, duration, master) => {
        const context = getAudioContext();
        if (!context || !soundOn) return;
        const oscillator = context.createOscillator();
        const overtone = context.createOscillator();
        const filter = context.createBiquadFilter();
        const gain = context.createGain();
        oscillator.type = 'sine';
        overtone.type = 'triangle';
        oscillator.frequency.setValueAtTime(midi(note), startAt);
        overtone.frequency.setValueAtTime(midi(note + 12), startAt);
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(480, startAt);
        gain.gain.setValueAtTime(.0001, startAt);
        gain.gain.exponentialRampToValueAtTime(.11, startAt + .018);
        gain.gain.exponentialRampToValueAtTime(.035, startAt + .22);
        gain.gain.exponentialRampToValueAtTime(.0001, startAt + duration);
        oscillator.connect(filter); overtone.connect(filter); filter.connect(gain).connect(master);
        remember(oscillator); remember(overtone);
        oscillator.start(startAt); overtone.start(startAt);
        oscillator.stop(startAt + duration + .03); overtone.stop(startAt + duration + .03);
      };

      const vibraphone = (note, startAt, duration, master, volume = .065) => {
        const context = getAudioContext();
        if (!context || !soundOn) return;
        const carrier = context.createOscillator();
        const shimmer = context.createOscillator();
        const gain = context.createGain();
        carrier.type = 'sine';
        shimmer.type = 'sine';
        carrier.frequency.setValueAtTime(midi(note), startAt);
        shimmer.frequency.setValueAtTime(midi(note) * 4.01, startAt);
        gain.gain.setValueAtTime(.0001, startAt);
        gain.gain.exponentialRampToValueAtTime(volume, startAt + .018);
        gain.gain.exponentialRampToValueAtTime(.0001, startAt + duration);
        carrier.connect(gain); shimmer.connect(gain); gain.connect(master);
        remember(carrier); remember(shimmer);
        carrier.start(startAt); shimmer.start(startAt);
        carrier.stop(startAt + duration + .03); shimmer.stop(startAt + duration + .03);
      };

      const brush = (startAt, master, accent = false) => {
        const context = getAudioContext();
        if (!context || !soundOn) return;
        const length = Math.floor(context.sampleRate * (accent ? .22 : .09));
        const buffer = context.createBuffer(1, length, context.sampleRate);
        const data = buffer.getChannelData(0);
        for (let index = 0; index < length; index += 1) data[index] = (Math.random() * 2 - 1) * (1 - index / length);
        const source = context.createBufferSource();
        const filter = context.createBiquadFilter();
        const gain = context.createGain();
        source.buffer = buffer;
        filter.type = accent ? 'bandpass' : 'highpass';
        filter.frequency.value = accent ? 2200 : 5200;
        gain.gain.value = accent ? .034 : .012;
        source.connect(filter).connect(gain).connect(master);
        remember(source);
        source.start(startAt);
      };

      const warmPad = (notes, startAt, duration, master) => {
        const context = getAudioContext();
        if (!context || !soundOn) return;
        notes.forEach((note, index) => {
          const oscillator = context.createOscillator();
          const filter = context.createBiquadFilter();
          const gain = context.createGain();
          oscillator.type = 'sine';
          oscillator.frequency.setValueAtTime(midi(note), startAt);
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(780, startAt);
          gain.gain.setValueAtTime(.0001, startAt);
          gain.gain.exponentialRampToValueAtTime(index === 0 ? .014 : .009, startAt + .7);
          gain.gain.setValueAtTime(index === 0 ? .014 : .009, startAt + Math.max(.75, duration - .8));
          gain.gain.exponentialRampToValueAtTime(.0001, startAt + duration);
          oscillator.connect(filter).connect(gain).connect(master);
          remember(oscillator);
          oscillator.start(startAt);
          oscillator.stop(startAt + duration + .04);
        });
      };

      const stopMusic = () => {
        window.clearTimeout(musicTimer);
        musicTimer = 0;
        musicNodes.forEach((node) => { try { node.stop(); } catch (error) {} });
        musicNodes.clear();
      };

      const playCanon = () => {
        const context = getAudioContext();
        if (!context || !soundOn) return;
        if (context.state === 'suspended') context.resume();
        stopMusic();
        const master = context.createGain();
        master.gain.value = .34;
        master.connect(context.destination);
        const beat = 60 / 64;
        const bar = beat * 4;
        const startAt = context.currentTime + .08;
        const chords = [
          [50,57,62,66,69], [45,52,57,61,64], [47,54,59,62,66], [42,49,54,57,61],
          [43,50,55,59,62], [50,57,62,66,69], [43,50,55,59,62], [45,52,57,61,64],
        ];
        const melody = [
          [78,null,76,null,74,null,73,null], [71,null,69,null,71,null,73,null],
          [74,null,73,null,71,null,69,null], [67,null,66,null,67,null,64,null],
          [62,null,64,null,66,null,67,null], [69,null,71,null,73,null,74,null],
          [71,null,73,null,74,null,76,null], [78,null,76,null,74,null,73,null],
        ];
        const activeChords = liteMode ? chords.slice(0, 4) : chords;
        const activeMelody = liteMode
          ? melody.slice(0, 4).map((row) => row.map((note, index) => index % 2 === 0 ? note : null))
          : melody;
        const pattern = liteMode ? [0, 2] : [0, 2, 1, 3];
        activeChords.forEach((chord, barIndex) => {
          const barStart = startAt + barIndex * bar;
          softPiano([chord[0] - 12], barStart, bar * .84, master);
          pattern.forEach((noteIndex, beatIndex) => {
            softPiano([chord[noteIndex]], barStart + beatIndex * beat, beat * 1.45, master);
          });
          activeMelody[barIndex].forEach((note, halfBeat) => {
            if (note !== null) softPiano([note], barStart + halfBeat * beat / 2 + .04, beat * 1.55, master);
          });
        });
        const songLength = activeChords.length * bar;
        musicTimer = window.setTimeout(() => {
          if (soundOn) playCanon();
        }, Math.max(1000, (songLength - .35) * 1000));
      };

      const playOpenChime = () => {
        const context = getAudioContext();
        if (!context || !soundOn) return;
        const now = context.currentTime + 0.03;
        [74,78,81,83].forEach((note, index) => tone(midi(note), now + index * 0.1, 1.15, 0.032, 'sine'));
      };

      const begin = () => {
        window.clearTimeout(readyTimer);
        window.clearTimeout(routeTimer);
        window.clearTimeout(watchdogTimer);
        stage.classList.remove('is-route', 'is-playing', 'is-ready', 'is-open');
        void stage.offsetWidth;
        stage.classList.add('is-route');
        setStatus('正在写下寄送的路线');
        playCanon();
        routeTimer = window.setTimeout(() => {
          stage.classList.remove('is-route');
          void stage.offsetWidth;
          stage.classList.add('is-playing');
          setStatus('雪鸮信使正在接近');
          readyTimer = window.setTimeout(() => {
            stage.classList.remove('is-playing');
            stage.classList.add('is-ready');
            setStatus('点击火漆封印拆信');
            seal.focus({ preventScroll: true });
          }, liteMode ? 2900 : 4150);
        }, liteMode ? 2450 : 4550);
        watchdogTimer = window.setTimeout(() => {
          if (!stage.classList.contains('is-ready') && !stage.classList.contains('is-open')) {
            stage.classList.remove('is-route', 'is-playing');
            stage.classList.add('is-ready');
            setStatus('点击火漆封印拆信');
          }
        }, liteMode ? 6500 : 10000);
      };

      const openLetter = () => {
        if (!stage.classList.contains('is-ready') || stage.classList.contains('is-open')) return;
        stage.classList.add('is-open');
        setStatus('照片正在让出信纸');
        playOpenChime();
        window.setTimeout(() => setStatus('信已经打开'), 3500);
      };

      const reset = () => {
        window.clearTimeout(readyTimer);
        window.clearTimeout(routeTimer);
        window.clearTimeout(watchdogTimer);
        stopMusic();
        stage.classList.remove('is-route', 'is-playing', 'is-ready', 'is-open');
        void stage.offsetWidth;
        begin();
      };

      start.addEventListener('click', begin);
      seal.addEventListener('click', openLetter);
      replay.addEventListener('click', reset);
      sound.addEventListener('click', () => {
        soundOn = !soundOn;
        sound.setAttribute('aria-pressed', String(soundOn));
        sound.setAttribute('aria-label', soundOn ? '关闭配乐' : '打开配乐');
        sound.textContent = soundOn ? '♫' : '♩';
        setStatus(soundOn ? '配乐已打开' : '配乐已关闭');
        if (soundOn) playCanon(); else stopMusic();
      });

      const openPhoto = () => {
        if (!stage.classList.contains('is-open')) return;
        if (!photoFront.firstElementChild) photoFront.append(photo.querySelector('.mol-photo-image').cloneNode(true));
        photoCard.classList.remove('is-flipped');
        flipPhoto.textContent = '翻到背面';
        photoViewer.classList.add('is-visible');
        photoViewer.setAttribute('aria-hidden', 'false');
        flipPhoto.focus({ preventScroll: true });
      };

      const closePhotoViewer = () => {
        photoViewer.classList.remove('is-visible');
        photoViewer.setAttribute('aria-hidden', 'true');
        photo.focus({ preventScroll: true });
      };

      photo.addEventListener('click', openPhoto);
      flipPhoto.addEventListener('click', () => {
        const flipped = photoCard.classList.toggle('is-flipped');
        flipPhoto.textContent = flipped ? '翻回正面' : '翻到背面';
      });
      closePhoto.addEventListener('click', closePhotoViewer);
      photoViewer.addEventListener('click', (event) => { if (event.target === photoViewer) closePhotoViewer(); });
    })();
  </script>
</div>
</body>
</html>
